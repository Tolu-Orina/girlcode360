version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin
  build:
    commands:
      # Plan artifact is a secondary input; PrimarySource is the git tree (no tfplan).
      - |
        set -euo pipefail
        PLAN_ROOT=""
        for v in $(env | awk -F= '/^CODEBUILD_SRC_DIR_TerraformPlanOutput/ {print $1}'); do
          PLAN_ROOT="${!v}"
          break
        done
        if [ -z "${PLAN_ROOT}" ] || [ ! -f "${PLAN_ROOT}/infra-backend/tfplan" ]; then
          echo "ERROR: tfplan not found in plan artifact"
          echo "Expected secondary input CODEBUILD_SRC_DIR_TerraformPlanOutput*"
          env | grep '^CODEBUILD_SRC_DIR' || true
          find /codebuild/output -name tfplan 2>/dev/null || true
          exit 1
        fi
        echo "Using plan artifact at ${PLAN_ROOT}"
        cp "${PLAN_ROOT}/infra-backend/tfplan" "${CODEBUILD_SRC_DIR}/infra-backend/tfplan"
        # Keep Lambda zip identical to what was planned (do not rebuild here)
        if [ -d "${PLAN_ROOT}/infra-backend/modules/lambda/codes/dist" ]; then
          rm -rf "${CODEBUILD_SRC_DIR}/infra-backend/modules/lambda/codes/dist"
          mkdir -p "${CODEBUILD_SRC_DIR}/infra-backend/modules/lambda/codes"
          cp -a "${PLAN_ROOT}/infra-backend/modules/lambda/codes/dist" \
            "${CODEBUILD_SRC_DIR}/infra-backend/modules/lambda/codes/dist"
        fi
      - cd "$CODEBUILD_SRC_DIR/infra-backend"
      - |
        terraform init \
          -backend-config="bucket=girlcode360-tf-state" \
          -backend-config="key=backend/${TF_VAR_environment}/terraform.tfstate" \
          -backend-config="region=${AWS_DEFAULT_REGION}" \
          -backend-config="dynamodb_table=girlcode360-tf-lock"
      - terraform apply -auto-approve tfplan
      # Schema after infra: cluster endpoint is in SSM; skip if DSQL disabled
      - cd "$CODEBUILD_SRC_DIR/infra-backend/scripts" && npm ci
      - node "$CODEBUILD_SRC_DIR/infra-backend/scripts/migrate-dsql.mjs"
artifacts:
  files:
    - '**/*'
