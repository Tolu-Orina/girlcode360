version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin
  build:
    commands:
      - cd infra-backend/modules/lambda/codes && npm ci && npm run build
      - cd "$CODEBUILD_SRC_DIR/infra-backend"
      - |
        set +e
        SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "girlcode360/${TF_VAR_environment}/app" --query SecretString --output text 2>/dev/null)
        set -e
        export SECRET_JSON
        export TF_VAR_google_oauth_client_id
        export TF_VAR_google_oauth_client_secret
        TF_VAR_google_oauth_client_id=$(python3 -c "import json,os; print(json.loads(os.environ.get('SECRET_JSON') or '{}').get('google_client_id') or '')")
        TF_VAR_google_oauth_client_secret=$(python3 -c "import json,os; print(json.loads(os.environ.get('SECRET_JSON') or '{}').get('google_client_secret') or '')")
        unset SECRET_JSON
      - |
        terraform init \
          -backend-config="bucket=girlcode360-tf-state" \
          -backend-config="key=backend/${TF_VAR_environment}/terraform.tfstate" \
          -backend-config="region=${AWS_DEFAULT_REGION}" \
          -backend-config="dynamodb_table=girlcode360-tf-lock"
      - |
        # Failed create_before_destroy leaves deposed deployments that cycle the graph.
        python3 - <<'PY'
        import json, subprocess, sys
        raw = subprocess.check_output(["terraform", "state", "pull"])
        state = json.loads(raw)
        changed = False
        for res in state.get("resources") or []:
            if res.get("type") != "aws_api_gateway_deployment" or res.get("name") != "main":
                continue
            inst = res.get("instances") or []
            kept = [i for i in inst if i.get("status") != "deposed"]
            if len(kept) != len(inst):
                print("Dropping %d deposed aws_api_gateway_deployment.main instance(s)" % (len(inst) - len(kept)))
                res["instances"] = kept
                changed = True
        if not changed:
            sys.exit(0)
        state["serial"] = int(state.get("serial") or 0) + 1
        path = "/tmp/tfstate-nodeposed.json"
        with open(path, "w") as f:
            json.dump(state, f)
        subprocess.check_call(["terraform", "state", "push", "-force", path])
        PY
      - terraform plan -var="enable_dsql=true" -out=tfplan
      - |
        # archive_file writes this during plan; apply needs the same zip on disk
        test -f modules/lambda/api.zip || { echo "ERROR: modules/lambda/api.zip missing after plan"; ls -la modules/lambda; exit 1; }
artifacts:
  files:
    - infra-backend/tfplan
    - infra-backend/modules/lambda/api.zip
    - infra-backend/modules/lambda/codes/dist/**/*
    - infra-backend/**/*
